  <circle cx="32" cy="32" r="29" fill="url(#ball-shade)" />

  <g clip-path="url(#ball-clip)" fill="none" stroke="#101528" stroke-width="2.4" stroke-linecap="round">
    <use href="#sector" />
    <use href="#sector" transform="rotate(120 32 32)" />
    <use href="#sector" transform="rotate(240 32 32)" />
