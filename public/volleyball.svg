<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="ball-clip">
      <circle cx="32" cy="32" r="22" />
    </clipPath>
    <radialGradient id="ball-shade" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="72%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
    <g id="panel-sector">
      <path d="M 32 32 Q 40 24, 54 22" />
      <path d="M 25 22 Q 36 16, 52 16" />
      <path d="M 21 15 Q 34 11, 48 11" />
    </g>
  </defs>

  <rect width="64" height="64" rx="16" fill="#3b1557" />

  <circle cx="32" cy="32" r="22" fill="url(#ball-shade)" />

  <g clip-path="url(#ball-clip)" fill="none" stroke="#3b1557" stroke-width="2.2" stroke-linecap="round">
    <use href="#panel-sector" />
    <use href="#panel-sector" transform="rotate(120 32 32)" />
    <use href="#panel-sector" transform="rotate(240 32 32)" />
  </g>

  <circle cx="32" cy="32" r="22" fill="none" stroke="#3b1557" stroke-width="2.2" />
</svg>
